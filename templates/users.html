{% extends 'base.html' %}{% block content %}<h1>Kullanıcı yönetimi</h1><div class="split"><form class="panel" method="post"><h2>Yeni kullanıcı</h2><label>Ad soyad</label><input name="full_name" required><label>Kullanıcı adı</label><input name="username" required><label>Geçici şifre (en az 12 karakter)</label><input type="password" name="password" minlength="12" required><label>Rol</label><select name="role">{% for role in roles %}<option>{{ role }}</option>{% endfor %}</select><button>Kullanıcı oluştur</button></form><div class="panel"><h2>Kayıtlı kullanıcılar</h2>{% for user in users %}<div class="userrow"><b>{{ user.full_name }}</b><span>{{ user.username }} · {{ user.role }}{% if not user.active %} · Pasif{% endif %}</span></div>{% endfor %}</div></div>{% endblock %}
